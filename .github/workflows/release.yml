name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs_on: ubuntu-latest
          - goos: linux
            goarch: arm64
            runs_on: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runs_on: macos-latest
          - goos: darwin
            goarch: arm64
            runs_on: macos-latest
          - goos: windows
            goarch: amd64
            runs_on: ubuntu-latest
          - goos: windows
            goarch: arm64
            runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          go build -ldflags "${LDFLAGS}" -o "utpr${EXT}" .

      - name: Package artifact
        run: |
          PACKAGE="utpr-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir dist

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            STAGE_DIR="${RUNNER_TEMP}/${PACKAGE}"
            rm -rf "${STAGE_DIR}"
            mkdir -p "${STAGE_DIR}"
            mv utpr "${STAGE_DIR}/utpr"
            cp LICENSE "${STAGE_DIR}/" 2>/dev/null || true
            hdiutil create -quiet -volname "${PACKAGE}" -srcfolder "${STAGE_DIR}" -ov -format UDZO "dist/${PACKAGE}.dmg"
          else
            mkdir "${PACKAGE}"
            if [ "${{ matrix.goos }}" = "windows" ]; then
              mv utpr.exe "${PACKAGE}/"
            else
              mv utpr "${PACKAGE}/"
            fi
            cp LICENSE "${PACKAGE}/" 2>/dev/null || true
            tar -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: utpr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=( *.tar.gz *.dmg )
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Build release notes
        run: |
          touch release_notes.txt
          TAG_MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -n "${TAG_MSG}" ]; then
            printf '%s\n' "${TAG_MSG}" > release_notes.txt
          fi
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "${PREV_TAG}" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "${PREV_TAG}" "${GITHUB_REF_NAME}" >> release_notes.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/SHA256SUMS
